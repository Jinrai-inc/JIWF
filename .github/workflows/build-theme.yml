name: Build theme ZIP

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build jiwf-academy.zip
        run: |
          mkdir -p build/jiwf-academy
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='node_modules' ./ build/jiwf-academy/
          cd build && zip -r ../jiwf-academy.zip jiwf-academy

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: jiwf-academy-theme
          path: jiwf-academy.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jiwf-academy.zip
